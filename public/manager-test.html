<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Local video fixture</title>
<style>html,body{margin:0;background:#14201b;color:#ddd;font:20px sans-serif}video{width:100%;height:100vh;object-fit:contain}canvas{display:none}</style>
<button id="black-test" style="position:fixed;right:12px;bottom:12px;z-index:9">Simulate black page</button><video autoplay muted playsinline></video><canvas width="960" height="540"></canvas>
<script>
const id = new URLSearchParams(location.search).get("id");
const previous = localStorage.getItem("isolation-test-account");
localStorage.setItem("isolation-test-account", id);
const previousCookie = document.cookie.split('; ').find(c => c.startsWith('sk-fixture-account='))?.split('=')[1];
document.cookie = 'sk-fixture-account='+id+'; Path=/; SameSite=Lax; Max-Age=3600';
const storageStatus = previous===id && previousCookie===id ? 'storage and cookie retained' : 'new test session';
document.title = 'Account '+id+' · '+storageStatus;
document.getElementById('black-test').onclick = () => { document.querySelector('video').style.visibility='hidden'; document.body.style.background='#000'; document.title='Black page fixture · account '+id; };
const canvas = document.querySelector("canvas"), ctx = canvas.getContext("2d"), video = document.querySelector("video");
video.srcObject = canvas.captureStream(24);
const start = performance.now();
const paint = () => {
 const t = (performance.now()-start)/1000;
 ctx.fillStyle = ["#394f47","#54624a","#65634f","#405566"][Number(id)%4]; ctx.fillRect(0,0,960,540);
 ctx.fillStyle="#d7e2ca"; ctx.font="24px sans-serif"; ctx.fillText("LOCAL VIDEO TEST · ACCOUNT "+id,50,65);
 ctx.font="90px monospace"; ctx.fillText(t.toFixed(1)+" s",50,260);
 ctx.font="20px sans-serif"; ctx.fillText(previous && previous!==id ? "ISOLATION FAILED: "+previous : "Independent profile: "+id,50,465);
 ctx.font="18px sans-serif"; ctx.fillText(storageStatus,50,500);
 ctx.beginPath();ctx.arc(700+80*Math.cos(t),270+80*Math.sin(t),40,0,Math.PI*2);ctx.fill();
};
setInterval(paint, 40); paint(); video.play();
window.__fixture = {id,previous,profileIsolated: !previous || previous===id};
</script></html>
